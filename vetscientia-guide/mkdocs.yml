site_name: Vet Scientia 
site_description: User and deployment guides for Vet Scientia

theme:
  name: material
  palette:
    primary: blue
    accent: light blue
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
    - content.code.copy

nav:
  - Home: index.md
  - User Guide:
      - Overview: user-guide.md
      - Getting Started: getting-started.md
      - Super Admin: super-admin.md
      - University Admin: university-admin.md
      - Clinic Admin: clinic-admin.md
      - Teacher: teacher.md
      - Student: student.md
      - Simulation: simulation.md
      - Troubleshooting: troubleshooting.md
      - Testing Notes: testing-notes.md
  - Development Setup: deployment.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences

extra_css:
  - stylesheets/extra.css
